name: Build ANIMEXA for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'academy.js'
      - 'academy.css'
      - 'films.js'
      - 'guide.js'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable app
        run: npm run dist:win
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: ANIMEXA-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
