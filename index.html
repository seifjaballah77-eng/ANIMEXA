function snapshot(){history.push(JSON.stringify(objects));if(history.length>60)history.shift();future=[]}
function addAsset(id,x=35,y=30){const a=assets.find(a=>a[0]===id);if(!a)return;snapshot();const o={id:crypto.randomUUID(),type:'asset',asset:id,name:names(a),x,y,w:18,h:25,color:$('drawColor').value,rot:0,opacity:100};objects.push(o);select(o.id);render();saveState()}
function addBasic(type){snapshot();const o={id:crypto.randomUUID(),type,name:type==='text'?'نص جديد':type==='rect'?'مستطيل':type==='circle'?'دائرة':'خط',x:38,y:35,w:24,h:24,color:$('drawColor').value,rot:0,opacity:100,text:type==='text'?'اكتب هنا':''};objects.push(o);select(o.id);render()}
function select(id){selected=id;render();renderProps()}
function render(){board.innerHTML='';objects.forEach(o=>{const el=document.createElement('div');el.className='obj'+(o.id===selected?' selected':'');el.dataset.id=o.id;Object.assign(el.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%',transform:'rotate('+o.rot+'deg)',opacity:o.opacity/100,color:o.color});if(o.type==='asset'){const a=assets.find(a=>a[0]===o.asset);el.innerHTML=svg(a,o.color)}else if(o.type==='text'){el.innerHTML='<div class="objtext" contenteditable="true"></div>';el.querySelector('.objtext').textContent=o.text||'';el.querySelector('.objtext').style.fontSize='20px';el.querySelector('.objtext').oninput=e=>{o.text=e.target.textContent}}else if(o.type==='rect'){el.innerHTML='<svg viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" rx="5" fill="'+o.color+'"/></svg>'}else if(o.type==='circle'){el.innerHTML='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="'+o.color+'"/></svg>'}else{el.innerHTML='<svg viewBox="0 0 100 100"><path d="M5 50H95" stroke="'+o.color+'" stroke-width="7"/></svg>'}const h=document.createElement('i');h.className='handle';el.append(h);el.addEventListener('pointerdown',e=>{if(e.target.isContentEditable)return;e.stopPropagation();selected=o.id;board.querySelectorAll('.obj').forEach(node=>node.classList.toggle('selected',node.dataset.id===selected));renderProps();renderLayers();if(e.target.classList.contains('handle'))return;dragStart(e,o,el)});board.append(el)});$('objectCount').textContent=objects.length+' عنصر';renderLayers()}
let drag=null;function dragStart(e,o,el){if(e.button!==0||e.target.classList.contains('handle'))return;snapshot();drag={o,el,pointerId:e.pointerId,x:e.clientX,y:e.clientY,ox:o.x,oy:o.y};try{el.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()}window.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==drag.pointerId)return;const r=board.getBoundingClientRect();if(!r.width||!r.height)return;drag.o.x=Math.max(0,Math.min(100-drag.o.w,drag.ox+(ev.clientX-drag.x)/r.width*100));drag.o.y=Math.max(0,Math.min(100-drag.o.h,drag.oy+(ev.clientY-drag.y)/r.height*100));drag.el.style.left=drag.o.x+'%';drag.el.style.top=drag.o.y+'%';syncProps()});function finishDrag(ev){if(!drag||(ev&&ev.pointerId!==drag.pointerId))return;drag=null;saveState()}window.addEventListener('pointerup',finishDrag);window.addEventListener('pointercancel',finishDrag);
board.addEventListener('pointerdown',e=>{if(e.target===board){selected=null;render();renderProps()}});
function renderProps(){const o=objects.find(o=>o.id===selected);$('noSelection').classList.toggle('hidden',!!o);$('props').classList.toggle('hidden',!o);if(!o)return;$('propName').value=o.name;$('propColor').value=o.color;$('propW').value=Math.round(o.w);$('propH').value=Math.round(o.h);$('propX').value=Math.round(o.x);$('propY').value=Math.round(o.y);$('propRot').value=o.rot;$('rotValue').textContent=o.rot;$('propOpacity').value=o.opacity;$('opacityValue').textContent=o.opacity;$('textField').classList.toggle('hidden',o.type!=='text');$('propText').value=o.text||''}
function syncProps(){const o=objects.find(o=>o.id===selected);if(!o)return;$('propX').value=Math.round(o.x);$('propY').value=Math.round(o.y)}
function updateProp(key,val){const o=objects.find(o=>o.id===selected);if(!o)return;o[key]=val;render();renderProps()}
function renderLayers(){$('layers').innerHTML=objects.slice().reverse().map(o=>'<div class="layer '+(o.id===selected?'active':'')+'"><span>'+o.name+'</span><button data-layer="'+o.id+'">تحديد</button></div>').join('');$('layers').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.layer))}
function saveState(){localStorage.setItem('animexa-project',JSON.stringify({name:$('nameInput').value||$('projectName').textContent,objects}));$('saveState').textContent='تم الحفظ محلياً'}
function loadState(){try{const d=JSON.parse(localStorage.getItem('animexa-project'));if(d){objects=d.objects||[];$('nameInput').value=d.name||'مشروع بدون عنوان';$('projectName').textContent=$('nameInput').value;render()}}catch(e){}}
function historyMove(back){const from=back?history:future,to=back?future:history;if(!from.length)return;to.push(JSON.stringify(objects));objects=JSON.parse(from.pop());selected=null;render();renderProps()}
function exportSVG(){const shapes=objects.map(o=>{const x=o.x/100*1600,y=o.y/100*900,w=o.w/100*1600,h=o.h/100*900;let body='';if(o.type==='asset'){const a=assets.find(a=>a[0]===o.asset);body='<g transform="scale('+w/100+' '+h/100+')">'+a[5]+'</g>'}else if(o.type==='text'){body='<text x="'+w/2+'" y="'+h/2+'" text-anchor="middle" dominant-baseline="middle" font-size="28">'+(o.text||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</text>'}else if(o.type==='circle')body='<ellipse cx="'+w/2+'" cy="'+h/2+'" rx="'+w/2+'" ry="'+h/2+'"/>';else body='<rect width="'+w+'" height="'+h+'"/>';return '<g transform="translate('+x+' '+y+') rotate('+o.rot+' '+w/2+' '+h/2+')" fill="'+o.color+'" opacity="'+o.opacity/100+'">'+body+'</g>'}).join('');const blob=new Blob(['<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#ffffff"/>'+shapes+'</svg>'],{type:'image/svg+xml'});download(blob,'animexa-design.svg')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('search').oninput=renderLibrary;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('libraryPane').classList.toggle('hidden',b.dataset.tab!=='library');$('toolsPane').classList.toggle('hidden',b.dataset.tab!=='tools')});
document.querySelectorAll('[data-rtab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-rtab]').forEach(x=>x.classList.toggle('active',x===b));$('propertiesPane').classList.toggle('hidden',b.dataset.rtab!=='properties');$('layersPane').classList.toggle('hidden',b.dataset.rtab!=='layers')});
$('rectBtn').onclick=()=>addBasic('rect');$('circleBtn').onclick=()=>addBasic('circle');$('textBtn').onclick=()=>addBasic('text');$('lineBtn').onclick=()=>addBasic('line');
$('saveBtn').onclick=()=>{saveState();$('projectName').textContent=$('nameInput').value};$('nameInput').oninput=()=>$('projectName').textContent=$('nameInput').value;
$('newBtn').onclick=()=>{if(confirm('بدء مشروع جديد؟ سيتم حفظ المشروع الحالي أولاً.')){saveState();objects=[];selected=null;render();renderProps()}};
$('exportBtn').onclick=exportSVG;$('undoBtn').onclick=()=>historyMove(true);$('redoBtn').onclick=()=>historyMove(false);
$('deleteBtn').onclick=()=>{if(selected){snapshot();objects=objects.filter(o=>o.id!==selected);selected=null;render();renderProps();saveState()}};
$('duplicateBtn').onclick=()=>{const o=objects.find(o=>o.id===selected);if(o){snapshot();const c={...o,id:crypto.randomUUID(),x:Math.min(85,o.x+4),y:Math.min(85,o.y+4)};objects.push(c);select(c.id);saveState()}};
$('frontBtn').onclick=()=>{const i=objects.findIndex(o=>o.id===selected);if(i>=0){snapshot();objects.push(objects.splice(i,1)[0]);render();saveState()}};
[['propName','name',v=>v],['propColor','color',v=>v],['propW','w',v=>+v],['propH','h',v=>+v],['propX','x',v=>+v],['propY','y',v=>+v],['propRot','rot',v=>+v],['propOpacity','opacity',v=>+v],['propText','text',v=>v]].forEach(([id,key,parse])=>$(id).oninput=e=>{const o=objects.find(o=>o.id===selected);if(!o)return;o[key]=parse(e.target.value);if(id==='propRot')$('rotValue').textContent=o.rot;if(id==='propOpacity')$('opacityValue').textContent=o.opacity;const el=board.querySelector('[data-id="'+selected+'"]');if(el){if(['name','text'].includes(key)){if(key==='text')el.querySelector('.objtext').textContent=o.text}else{el.style.left=o.x+'%';el.style.top=o.y+'%';el.style.width=o.w+'%';el.style.height=o.h+'%';el.style.color=o.color;el.style.opacity=o.opacity/100;el.style.transform='rotate('+o.rot+'deg)';if(key==='color')render()}}renderLayers()});
$('zoomIn').onclick=()=>{zoom=Math.min(1.5,zoom+.1);board.style.width=(Math.min(100,zoom*100))+'%';$('zoomLabel').textContent=Math.round(zoom*100)+'%'};$('zoomOut').onclick=()=>{zoom=Math.max(.5,zoom-.1);board.style.width=(Math.min(100,zoom*100))+'%';$('zoomLabel').textContent=Math.round(zoom*100)+'%'};
$('langBtn').onclick=()=>{lang=lang==='ar'?'fr':lang==='fr'?'en':'ar';$('langBtn').textContent=lang==='ar'?'العربية':lang==='fr'?'Français':'English';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('search').placeholder=translations[lang].search;$('noResults').textContent=translations[lang].no;renderCategories();renderLibrary();objects.forEach(o=>{const a=assets.find(a=>a[0]===o.asset);if(a)o.name=names(a)});render()};
$('board').addEventListener('dragover',e=>e.preventDefault());$('board').addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(id){const r=board.getBoundingClientRect();addAsset(id,(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)}});
window.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&selected)$('deleteBtn').click();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveState()}});
renderCategories();renderLibrary();loadState();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
